name: CI

on:
  pull_request:
  push:
    branches: [main, develop]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # The build each release was checked against; a release moves it
  CLAUDE_CODE_VERSION: 2.1.325
  # Keep the pinned CLI from updating itself or sending telemetry
  DISABLE_AUTOUPDATER: 1
  CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC: 1

jobs:
  # Every check runs with no sign-in: the tests drive the CLI in a throwaway account, so no secret is needed.
  # The matrix (npm run matrix) is not here: it installs real servers and is run by hand on a throwaway project.
  checks:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # No lockfile is tracked: the build tools are pinned exactly in package.json
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          package-manager-cache: false

      - name: npm install
        run: npm install --no-audit --no-fund

      - name: Install Claude Code
        run: npm install -g "@anthropic-ai/claude-code@${{ env.CLAUDE_CODE_VERSION }}"

      - name: claude --version
        run: claude --version

      - name: npm run typecheck
        run: npm run typecheck

      - name: npm run lint
        run: npm run lint

      - name: npm run validate
        run: npm run validate

      # Windows only reads TEMP and TMP: the hosted runner's own temp folder is under C:\Users\RUNNER~1, an 8.3 short
      # path the tests' scratch projects then disagree with the CLI about (first Windows run: 19 failures naming it)
      - name: npm test
        env:
          TEMP: ${{ runner.temp }}
          TMP: ${{ runner.temp }}
        run: npm test

      - name: npm run kit:check
        run: npm run kit:check
